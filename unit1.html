
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unit 1 Smart Listening</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input { padding: 8px; width: 200px; font-size: 16px; }
    .status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

<h1>Unit 1 Smart Listening Practice</h1>
<audio controls src="Unit1.mp3"></audio>

<p><b id="prompt">Word 1 of 5</b></p>
<input id="answer" placeholder="Type your answer" autofocus />
<p class="status" id="feedback"></p>

<script>
const words = ["water", "garden", "insurance", "bird", "transport", "glass", "park", "interview", "light", "station", "city", "forest", "school", "balcony", "family", "garage", "map", "museum", "river", "time", "training", "children", "kitchen", "magazine", "wood", "bone", "bridge", "flower", "internet", "library", "parking", "photo", "supermarket", "temperature", "website", "electricity", "government", "plastic", "safety", "stone", "beach", "fire", "fish", "fishing", "helicopter", "insect", "music", "newspaper", "radio", "reference", "soil", "wind", "airport", "bank", "bike", "business", "cinema", "climate", "desert", "energy", "factory", "farm", "feedback", "furniture", "money", "noise", "reception", "salt", "theatre", "boat", "certificate", "clean", "club", "colour", "communication", "computer", "disease", "environment", "farming", "golf", "grass", "gym", "hospital", "lake", "manager", "market", "material", "mountain", "name", "photograph", "piano", "plant", "population", "presentation", "research", "rock", "sea", "shower", "social", "sport", "storm", "tennis", "tutor", "weight", "age", "animal", "bicycle", "camera", "chemical", "cleaning", "coffee", "confidence", "egg", "entertainment", "film", "food", "helmet", "hotel", "india", "nut", "phone", "report", "restaurant", "sailing", "security", "size", "skill", "speed", "studio", "tax", "technology", "traditional", "train", "video", "village", "weather", "behaviour", "cake", "car", "chocolate", "competition", "cooking", "culture", "decoration", "distance", "equipment", "flat", "flexible", "fridge", "gas", "genetic", "gift", "group", "language", "locker", "microwave", "north", "oil", "passport", "picture", "reading", "resource", "road", "student", "swimming", "teenager", "traffic", "academic", "agriculture", "apartment", "back", "basement", "book", "booklet", "box", "breakfast", "bus", "cheese", "cheque", "clay", "clothes", "coast", "concentration", "corn", "cost", "deposit", "direction", "discount", "dry", "exercise", "fear", "friend", "guide", "health", "history", "housing", "hunting", "image", "japanese", "job", "lunch", "meal", "method", "mirror", "negative", "nutrition", "observation", "open", "organic", "painting", "parent", "permit", "pool", "public", "quality", "question", "rainfall", "record", "relationship", "sale", "sample", "science", "seafood", "seminar", "silver", "spanish", "standard", "store", "street", "sugar", "summer", "sun", "survey", "team", "tent", "ticket", "tool", "tree", "university", "view", "weekend", "wheelchair", "window", "winter", "women", "action", "adult", "advertisement", "alarm", "bacteria", "bag", "band", "bathroom", "brick", "building", "camel", "cash", "castle", "cave", "central", "coach", "college", "commercial", "conference"];
let currentIndex = 0;
let userAnswers = new Array(words.length).fill("");
const lookahead = 3;

function showPrompt() {
  document.getElementById("prompt").textContent = "Word " + (currentIndex + 1) + " of " + words.length;
  document.getElementById("answer").value = "";
  document.getElementById("answer").focus();
  document.getElementById("feedback").textContent = "";
}

function checkInput() {
  const input = document.getElementById("answer").value.trim().toLowerCase();
  if (!input) return;

  for (let offset = 0; offset <= lookahead && (currentIndex + offset) < words.length; offset++) {
    if (words[currentIndex + offset] === input) {
      userAnswers[currentIndex + offset] = input;
      document.getElementById("feedback").textContent =
        "✅ Matched with word " + (currentIndex + offset + 1) + ": " + words[currentIndex + offset];
      currentIndex = currentIndex + offset + 1;
      if (currentIndex >= words.length) {
        finish();
        return;
      }
      showPrompt();
      return;
    }
  }

  document.getElementById("feedback").textContent = "❌ Incorrect. No match found in next " + lookahead + " words.";
}

function finish() {
  let correct = 0;
  for (let i = 0; i < words.length; i++) {
    if (userAnswers[i] === words[i]) correct++;
  }
  let msg = `🎉 Done! Score: ${correct} / ${words.length}\n\n`;
  for (let i = 0; i < words.length; i++) {
    msg += `${i+1}. Correct: ${words[i]} | Your: ${userAnswers[i] || "(empty)"}\n`;
  }
  alert(msg);
}

document.getElementById("answer").addEventListener("keypress", function(e) {
  if (e.key === "Enter") checkInput();
});

showPrompt();
</script>

</body>
</html>
